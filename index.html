<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processos SEI - Auxílios</title>
    <style>
        /* Reseta as margens e define a fonte da página */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Cria um 'cartão' branco centralizado */
        .card {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px; /* Levemente ajustado para o formulário */
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 24px;
            margin-bottom: 30px;
        }

        /* Contêiner para empilhar os botões */
        .botoes-container {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espaço entre os botões */
        }

        /* Estilo base compartilhado pelos botões */
        .btn-processo {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        /* 1. Botão de Alimentação (Laranja) */
        .btn-alimentacao {
            background-color: #d35400; 
            box-shadow: 0 4px 6px rgba(211, 84, 0, 0.3);
        }
        .btn-alimentacao:hover {
            background-color: #e67e22;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(211, 84, 0, 0.4);
        }
        .btn-alimentacao:active { transform: translateY(0); }

        /* 2. Botão de Educação (Azul) */
        .btn-educacao {
            background-color: #2980b9; 
            box-shadow: 0 4px 6px rgba(41, 128, 185, 0.3);
        }
        .btn-educacao:hover {
            background-color: #3498db;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(41, 128, 185, 0.4);
        }
        .btn-educacao:active { transform: translateY(0); }

        /* 3. Botão de Saúde (Vermelho) */
        .btn-saude {
            background-color: #e74c3c; 
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.3);
        }
        .btn-saude:hover {
            background-color: #c0392b;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
        }
        .btn-saude:active { transform: translateY(0); }

        /* 4. Botão Green Card (Verde) */
        .btn-greencard {
            background-color: #27ae60; 
            box-shadow: 0 4px 6px rgba(39, 174, 96, 0.3);
        }
        .btn-greencard:hover {
            background-color: #2ecc71;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.4);
        }
        .btn-greencard:active { transform: translateY(0); }

        /* Estilos do Formulário Novo */
        .divisor {
            border: 0;
            height: 1px;
            background: #e0e0e0;
            margin: 30px 0;
        }

        .form-solicitacao {
            text-align: left;
        }

        .form-solicitacao p {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .form-solicitacao input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-solicitacao input:focus {
            outline: none;
            border-color: #25D366;
        }

        /* Botão do WhatsApp (Verde Específico) */
        .btn-whatsapp {
            background-color: #25D366; 
            box-shadow: 0 4px 6px rgba(37, 211, 102, 0.3);
            width: 100%;
            display: block;
            text-align: center;
        }
        .btn-whatsapp:hover {
            background-color: #128C7E;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4);
        }
        .btn-whatsapp:active { transform: translateY(0); }

    </style>
</head>
<body>
    
    <div class="card">
        <h1>Meus Processos SEI</h1>
        
        <div class="botoes-container">
            <!-- Alimentação -->
            <a class="btn-processo btn-alimentacao" href="https://sei.rj.gov.br/sei/modulos/pesquisa/md_pesq_processo_exibir.php?IC2o8Z7ACQH4LdQ4jJLJzjPBiLtP6l2FsQacllhUf-duzEubalut9yvd8-CzYYNLu7pd-wiM0k633-D6khhQNU8i0ecJkKgW7-RIB81Th8kWWv7piM22_Cgdlf1OZ1-Z" target="_blank">
                🍗 Auxílio Refeição
            </a>

            <!-- Educação -->
            <a class="btn-processo btn-educacao" href="https://sei.rj.gov.br/sei/modulos/pesquisa/md_pesq_processo_exibir.php?IC2o8Z7ACQH4LdQ4jJLJzjPBiLtP6l2FsQacllhUf-duzEubalut9yvd8-CzYYNLu7pd-wiM0k633-D6khhQNWgMc3UN1W5orQ-cP3i0Xry_NDPZwUqwhfoP4cp52RH1" target="_blank">
                📚 Auxílio Educação
            </a>

            <!-- Saúde -->
            <a class="btn-processo btn-saude" href="https://sei.rj.gov.br/sei/modulos/pesquisa/md_pesq_processo_exibir.php?IC2o8Z7ACQH4LdQ4jJLJzjPBiLtP6l2FsQacllhUf-duzEubalut9yvd8-CzYYNLu7pd-wiM0k633-D6khhQNcBN57oqmcdGhIjqzXqjN8IE0CddU3DpOxMz_kBi1dVw" target="_blank">
                🏥 Auxílio Saúde
            </a>

            <!-- Green Card -->
            <a class="btn-processo btn-greencard" href="https://sei.rj.gov.br/sei/modulos/pesquisa/md_pesq_processo_exibir.php?IC2o8Z7ACQH4LdQ4jJLJzjPBiLtP6l2FsQacllhUf-duzEubalut9yvd8-CzYYNLu7pd-wiM0k633-D6khhQNUw2q4jVmdPr3JzlxDC6xTxcHOUiR0klGl6NwNN-HABs" target="_blank">
                💳 Green Card
            </a>
        </div>

        <hr class="divisor">

        <!-- Novo Formulário de Solicitação -->
        <div class="form-solicitacao">
            <p><strong>Gostaria de ter um processo de interesse aqui com link rápido?</strong> Informe o número do processo SEI e o assunto e vamos analisar seu pedido.</p>
            
            <input type="text" id="numeroSei" placeholder="Número do Processo SEI" required>
            <input type="text" id="assuntoSei" placeholder="Assunto (Ex: Férias, Licença)" required>
            
            <button id="btnEnviarWhatsapp" class="btn-processo btn-whatsapp">
                💬 Solicitar via WhatsApp
            </button>
        </div>
    </div>

    <!-- Script para enviar dados ao WhatsApp -->
    <script>
        document.getElementById('btnEnviarWhatsapp').addEventListener('click', function() {
            // Captura os valores digitados
            const numeroSei = document.getElementById('numeroSei').value.trim();
            const assuntoSei = document.getElementById('assuntoSei').value.trim();

            // Validação simples
            if (numeroSei === '' || assuntoSei === '') {
                alert('Por favor, preencha o número do processo e o assunto antes de enviar.');
                return;
            }

            // Monta a mensagem que será enviada
            const telefone = "5521990097858";
            const mensagem = `Olá! Gostaria de solicitar a inclusão de um processo de interesse no sistema.\n\n*Número do Processo SEI:* ${numeroSei}\n*Assunto:* ${assuntoSei}`;
            
            // Codifica a mensagem para o formato de URL
            const mensagemCodificada = encodeURIComponent(mensagem);
            
            // Cria o link do WhatsApp e abre em uma nova aba
            const urlWhatsapp = `https://api.whatsapp.com/send?phone=${telefone}&text=${mensagemCodificada}`;
            window.open(urlWhatsapp, '_blank');
        });
    </script>
</body>
</html>
